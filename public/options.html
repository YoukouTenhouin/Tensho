<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tensho settings</title><link rel="stylesheet" href="panel.css"></head>
<body class="options-page">
<header><a class="brand" href="#">Tensho</a><span class="muted">Settings</span></header>
<main class="settings-layout">
<nav aria-label="Settings sections"><a href="#providers">Providers</a><a href="#reading-sites">Reading sites</a><a href="#sources">Sources</a></nav>
<div class="settings-content">
<h1>Settings</h1>
<section id="providers" aria-labelledby="providers-heading"><h2 id="providers-heading">Providers</h2><div id="settings-editor"></div>
<div class="access-settings"><h3>Service access</h3><p id="provider-access" role="status" aria-atomic="true"></p><button id="enable-providers" type="button">Enable Latin providers</button></div></section>
<section id="reading-sites" aria-labelledby="sites-heading"><h2 id="sites-heading">Reading sites</h2>
<form id="site"><label for="origin">Site origin</label><div class="row"><input id="origin" type="url" placeholder="https://example.org" required><button>Add site</button></div></form><ul id="sites" class="site-list"></ul><p id="sites-empty" class="muted" hidden>No sites enabled.</p></section>
<section id="sources" aria-labelledby="sources-heading"><h2 id="sources-heading">Sources</h2><div id="source-credits"></div></section>
<p id="feedback" role="alert"></p>
</div>
</main>
<script src="options.js"></script>
</body></html>
