<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tensho lookup</title><link rel="stylesheet" href="panel.css"></head>
<body>
<header class="panel-header"><h1>Tensho</h1><div class="row header-actions">
<button id="open-settings" class="icon-button" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.1-1.8 1L4.5 6 2 10l1.6 1.6v1.8L2 15l2.5 4 2.1-.1 1.8 1L9 22h5l.6-2.1 1.8-1 2.1.1 2.5-4-1.6-1.6v-1.8L21 10l-2.5-4-2.1.1-1.8-1L14 3Z"/><circle cx="11.5" cy="12.5" r="3"/></svg></button>
<button id="close" class="icon-button" type="button" aria-label="Close lookup" title="Close lookup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div></header>
<form id="lookup"><label class="sr-only" for="word">Word or passage</label><div class="row lookup-row"><textarea id="word" name="word" autocomplete="off" rows="2" placeholder="Word or passage" required></textarea><button class="primary">Look up</button></div></form>
<div class="language-row"><button id="language-button" class="text-button" type="button" popovertarget="language-popover" aria-controls="language-popover" aria-expanded="false"><span id="active-settings">Loading…</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button></div>
<div id="language-popover" popover><fieldset id="language-controls"><legend>Languages</legend><label for="lookup-language">Lookup language</label><select id="lookup-language"></select><label id="explanation-label" for="explanation-language">Explanations</label><select id="explanation-language"></select><p id="explanation-value"></p></fieldset><p id="language-message" role="status" aria-atomic="true"></p></div>
<div class="context-actions"><p id="configuration-status" role="status" aria-atomic="true"></p><button id="enable-current" class="text-button" type="button" hidden>Enable on this site</button><button id="provider-settings" class="text-button" type="button" hidden>Enable providers in Settings</button></div>
<main id="results" tabindex="-1" aria-label="Lookup results"><section id="passage" hidden aria-labelledby="passage-heading"><h2 id="passage-heading">Passage</h2><p id="passage-original"></p><div id="passage-words" role="group" aria-label="Choose a passage word"></div></section><h2 id="target">Ready to read</h2><p id="status" aria-live="polite" aria-atomic="true"></p><p id="dictionary-status" class="sr-only" aria-live="polite" aria-atomic="true"></p><div id="analysis"></div><button id="retry" type="button" hidden>Retry lookup</button></main>
<p id="feedback" role="alert"></p>
<script src="panel.js"></script>
</body></html>
